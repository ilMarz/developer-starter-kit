name: Check starter kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # GitHub's hosted runner supplies Node; nothing is installed for project users.
      - run: node --version
      - run: node tools/check-kit.mjs
      - run: node --test tests/*.test.mjs
